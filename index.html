<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0C0A" />
  <meta name="description" content="CHAINRAIDERS — pixel art on Robinhood Chain. 5,000 raiders, Anvil AMM, 100% royalties." />
  <title>CHAINRAIDERS</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="mast">
      <div class="brand">
        <h1>CHAINRAIDERS</h1>
        <p>Robinhood Chain</p>
      </div>
      <a class="cta" href="#">OpenSea</a>
    </header>

    <main>
      <figure class="hero" id="hero">
        <div class="plate">
          <img
            id="teaser"
            src="art/01.png"
            width="350"
            height="350"
            alt="CHAINRAIDERS teaser 01 / 24"
          />
        </div>
        <figcaption class="step">
          <button type="button" id="prev">Prev</button>
          <span id="counter">01 / 24</span>
          <button type="button" id="next">Next</button>
        </figcaption>
        <p class="hint">Tap or use arrows to meet another</p>
      </figure>

      <ul class="facts">
        <li>5,000 raiders</li>
        <li>Robinhood Chain</li>
        <li>Anvil AMM</li>
        <li>100% royalties</li>
      </ul>
    </main>

    <footer class="foot">
      <nav aria-label="Collection links">
        <a href="#">Anvil</a>
        <a href="#">X</a>
        <a href="#">Discord</a>
      </nav>
      <p>© CHAINRAIDERS</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
